name: CI

on:
  push:
    branches: [main, feature/nextjs-rewrite]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://fund.korucha.com
          NEXT_TELEMETRY_DISABLED: "1"
