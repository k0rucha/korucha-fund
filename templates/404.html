{% extends "base.html" %}

{% block title %}404 Not Found — こるちゃファンド{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-12 text-center fade-in">
    <img src="/static/404.webp" alt="404 Not Found" class="w-full max-w-md mb-10 rounded-2xl">
    <h2 class="text-4xl font-extrabold text-da-blue-1200 mb-4 tracking-tight">404 - Page Not Found</h2>
    <p class="text-da-gray-600 mb-10 max-w-lg text-lg">
        お探しのページは見つかりませんでした。<br>
        URLが正しいか確認するか、トップページにお戻りください。
    </p>
    <a href="/" class="refresh-btn text-white px-10 py-4 rounded-xl text-lg font-bold shadow-lg transition-all hover:scale-105 active:scale-95">
        トップページに戻る
    </a>
</div>
{% endblock %}
