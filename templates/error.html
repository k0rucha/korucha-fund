{% extends "base.html" %}

{% block title %}エラー — こるちゃファンド{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-12 text-center fade-in">
    <img src="/static/error.webp" alt="Error" class="w-full max-w-md mb-10 rounded-2xl">
    <h2 class="text-4xl font-extrabold text-da-blue-1200 mb-4 tracking-tight">System Error</h2>
    <p class="text-da-gray-600 mb-10 max-w-lg text-lg">
        申し訳ありません。予期せぬエラーが発生しました。<br>
        サーバーで問題が起きている可能性があります。
    </p>
    <div class="flex flex-col sm:flex-row gap-4">
        <button id="reloadPage" type="button" class="da-card px-10 py-4 text-lg font-bold text-da-blue-900 hover:bg-da-blue-50 transition-all hover:scale-105 active:scale-95">
            ページを再読み込み
        </button>
        <a href="/" class="refresh-btn text-white px-10 py-4 rounded-xl text-lg font-bold shadow-lg transition-all hover:scale-105 active:scale-95">
            トップページに戻る
        </a>
    </div>
</div>
<script>
document.getElementById('reloadPage')?.addEventListener('click', () => location.reload());
</script>
{% endblock %}
